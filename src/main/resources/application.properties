spring.application.name=BeautySalonBot
bot.name=BeautySalonBot
server.port=8080

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.threads.virtual.enabled=true
spring.profiles.active=dev

# TimeZone
spring.jackson.time-zone=Europe/Samara
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Samara

telegram.bot.token=${BOT_TOKEN}
telegram.bot.username=${BOT_NAME}

# Mini App
miniapp.jwt-secret=${JWT_SECRET:default-fallback-secret-for-dev-environment-at-least-256-bits-long!}
miniapp.jwt-ttl-hours=24
miniapp.url=${MINI_APP_URL:}
miniapp.origin=${MINI_APP_ORIGIN:*}
